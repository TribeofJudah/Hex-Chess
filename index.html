<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#efe6d4"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Gliński's hexagonal chess — 91 cells, hotseat, vs engine, or remote play."
    />
    <title>Hex Chess — Gliński's Variant</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Runs before first paint so a stored theme never flashes the other
      // mood. Mirrors THEME_KEY / readStoredTheme in src/App.tsx — the two
      // must agree on the key. `system` is stored as well; only the pinning
      // values set the attribute.
      ;(function () {
        try {
          var theme = localStorage.getItem('hexchess:theme')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme)
          }
        } catch (error) {
          // Storage blocked (private mode): leave the OS preference in charge.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
